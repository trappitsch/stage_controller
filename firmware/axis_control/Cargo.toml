[package]
name = "axis_control"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-sync = "0.8.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
tmc2209-uart = { version = "0.1.0", default-features = false, features = [
    "async",
] }

defmt = { version = "1.1.1", optional = true }

[features]
defmt = ["dep:defmt", "tmc2209-uart/defmt"]
