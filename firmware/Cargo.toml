[workspace]
members = ["axis_control", "rp2350"]

resolver = "3"

[workspace.dependencies]
bbqueue = {
  version = "0.7",
  default-features = false,
  features = [
    "critical-section",
    "maitake-sync-0_3",
  ]
}
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = {
  version = "0.10",
  features = [
    "defmt",
    "executor-interrupt",
    "executor-thread",
    "platform-cortex-m",
  ]
}
embassy-futures = "0.1.2"
embassy-rp = {
  version = "0.10",
  features = [
    "critical-section-impl",
    "defmt",
    "rp235xa",
    "time-driver",
    "unstable-pac",
  ]
}
embassy-sync = "0.8"
embassy-time = {
  version = "0.5",
  features = [
    "defmt",
    "defmt-timestamp-uptime",
  ]
}
embassy-usb = "0.6"
embedded-hal = "1"
embedded-hal-async = "1"
embedded-io-async = "0.7.0"
ergot = {
  git = "https://github.com/jamesmunns/ergot.git",
  rev = "d42d38a",
  features = [
    "defmt-v1",
    "embassy-usb-v0_6",
  ]
}
ic-md = { version = "0.2.0", default-features = false, features = ["async"] }
maitake-sync = { version = "0.3", default-features = false }
mutex = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2"

axis_control = { path = "axis_control", features = ["defmt"] }
icd = { path = "../icd", features = ["defmt"] }

[profile.release]
opt-level = "z"
debug = 2
lto = true
incremental = false
codegen-units = 1

[profile.ci]
inherits = "dev"
debug = false
strip = true
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = false
codegen-units = 256
rpath = false
