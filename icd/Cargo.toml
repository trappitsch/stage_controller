[package]
name = "icd"
version = "0.1.0"
edition = "2024"

[dependencies]
ergot = { git = "https://github.com/jamesmunns/ergot.git", rev = "d42d38a", features = [
    "defmt-v1",
] }
postcard-schema = { version = "0.2", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive"] }
defmt = { version = "1.1.1", optional = true }

[features]
"defmt" = ["dep:defmt"]
